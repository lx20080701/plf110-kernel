name: Build PLF110 kernel (6.1.134 + Droidspaces)

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO: none = 与原厂一致(默认，必须选这个才最稳) / thin = 实验"
        type: choice
        options:
          - none
          - thin
        default: none
      debug_info:
        description: "Keep debug info + KASAN/BTF (very slow, debugging only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 与设备固件匹配的源码版本：
  #   设备固件 PLF110_16.0.2.401(CN01) 构建于 2025-12-09（ro.bootimage.build.date）
  #   对应 OnePlusOSS 上最接近的同步 = PLF110_16.0.0.203（2025-12-18），内核同样是 6.1.134
  #   （之前用 16.0.5.701 + Google gki_defconfig 导致 init 起不来，详见 README）
  KERNEL_REPO: OnePlusOSS/android_kernel_oneplus_mt6989
  KERNEL_COMMIT: 76bcc45d34eac1a834830b356d0589020f4be059
  # 厂商 modules/devicetree 树：内核树里的 drivers/soc/oplus/* 等是符号链接，
  # 指向 ../../../../vendor/oplus/...（OPLUS kernel_platform 布局），必须一起取，
  # 否则 Kconfig 解析直接失败：can't open file "drivers/soc/oplus/oplus_resctrl/Kconfig"
  MODULES_REPO: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_mt6989
  MODULES_COMMIT: efa5a76b4a472e8dfbeea906fb6c05e931334e68
  PATCH_RAW: https://raw.githubusercontent.com/WildKernels/kernel_patches/main
  CLANG_URL: https://github.com/WildKernels/OnePlus_KernelSU_SUSFS/releases/download/toolchain-cache/clang-28b975ada54f8610ed531a6b57253aed10e7c87d.tar.gz
  AK3_URL: https://github.com/WildKernels/OnePlus_KernelSU_SUSFS/releases/download/toolchain-cache/AnyKernel3-0b46673ae91aee8d60bd6ee257b4d56d3f6a0114.tar.gz
  NAME: PLF110-A16-6.1.134

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            lz4 zstd cpio kmod rsync zip unzip python3 git curl aria2 dos2unix ca-certificates

      - name: Fetch clang r487747c
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/toolchain"
          cd "$RUNNER_TEMP/toolchain"
          aria2c -q -x8 -s8 -k1M --file-allocation=none --console-log-level=error \
                 -o clang.tar.gz "$CLANG_URL"
          tar -xzf clang.tar.gz --wildcards '*/clang-r487747c/*' || tar -xzf clang.tar.gz
          BIN_DIR="$(dirname "$(find . -type f -path '*/clang-r487747c/bin/clang' | head -n1)")"
          echo "CLANG_BIN=$PWD/${BIN_DIR#./}" >> "$GITHUB_ENV"
          "$PWD/${BIN_DIR#./}/clang" --version | head -n1

      - name: Fetch kernel source + vendor modules
        run: |
          set -e
          # 1) GKI 内核树（common）
          curl -LfsS --retry 3 -o kernel.tar.gz \
            "https://codeload.github.com/${KERNEL_REPO}/tar.gz/${KERNEL_COMMIT}"
          tar -xzf kernel.tar.gz
          KDIR="$(find . -maxdepth 1 -type d -name 'android_kernel_oneplus_mt6989-*' | head -n1)"

          # 2) 厂商 modules/devicetree 树：解到工作区根，得到 kernel/ 和 vendor/
          #    内核树里的符号链接形如 ../../../../vendor/oplus/kernel/...
          #    （从 <内核树>/drivers/soc/oplus 上 4 层 = 工作区根），布局对了才能解析
          curl -LfsS --retry 3 -o modules.tar.gz \
            "https://codeload.github.com/${MODULES_REPO}/tar.gz/${MODULES_COMMIT}"
          tar -xzf modules.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1

          echo "KDIR=$GITHUB_WORKSPACE/${KDIR#./}" >> "$GITHUB_ENV"
          echo "source: $(basename "$KDIR")"
          head -n5 "$KDIR/Makefile"

          # 3) 校验厂商符号链接全部能解析（不解析 → make gki_defconfig 直接报 can't open file）
          bad=0
          for p in drivers/soc/oplus/oplus_resctrl/Kconfig \
                   drivers/soc/oplus/storage/Kconfig \
                   include/soc/oplus/storage \
                   kernel/oplus_cpu \
                   kernel/locking/locking_main.h \
                   kernel/locking/oplus_locking.c \
                   kernel/locking/sa_common_struct.h \
                   mm/mm-trace.h; do
            if [ ! -e "$KDIR/$p" ]; then
              echo "::error::vendor 符号链接未解析: $p"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
          echo "vendor symlink 检查通过（$(du -sh "$GITHUB_WORKSPACE/vendor" | cut -f1)）"
          df -h / | tail -n1

      - name: Apply patches and config
        env:
          LTO_MODE: ${{ inputs.lto }}
          DEBUG_INFO: ${{ inputs.debug_info }}   # run7 教训：之前漏了这一行，debug_info=true 根本没传给 prepare.sh
          STOCK_CONFIG: ${{ github.workspace }}/config/plf110_stock.config
        run: |
          set -e
          # features.env 与 workflow 输入共享键名时，后 source 的会覆盖 workflow 传的值
          # （run10 就是 DEBUG_INFO=true 被 features.env 里的 false 吃掉，白编 16 分钟）。
          # 这里加闸门：features.env 出现 workflow 拥有的键 → 立即失败。
          if grep -nE '^(DEBUG_INFO|KABI_BYPASS|LTO_MODE)=' config/features.env; then
            echo "::error::config/features.env 含 workflow 拥有的键，会反向覆盖输入"
            exit 1
          fi
          set -a
          . config/features.env
          set +a
          bash scripts/prepare.sh

      - name: Build Image
        run: |
          set -e
          set -o pipefail   # 否则 make | tee 会把编译失败吞成 success（run4 的教训）
          cd "$KDIR"
          set -a
          . "$GITHUB_WORKSPACE/config/features.env"
          set +a
          export PATH="$CLANG_BIN:$PATH"
          export ARCH=arm64 LLVM=1
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          # prepare.sh 会把"设备原厂 /proc/config.gz"复制成 arch/arm64/configs/plf110_defconfig
          make -j"$(nproc)" O=out plf110_defconfig
          make -j"$(nproc)" O=out olddefconfig

          echo "---- config check ----"
          check() {
            grep -q "^CONFIG_${1}=y$" out/.config || { echo "::error::missing CONFIG_${1}"; exit 1; }
          }
          report() {   # 只报告，不中断
            if grep -q "^CONFIG_${1}=y$" out/.config; then
              echo "✅ CONFIG_${1}=y"
            elif grep -q "^CONFIG_${1}=m$" out/.config; then
              echo "❌ CONFIG_${1}=m"
            else
              echo "❌ CONFIG_${1} 未设置"
            fi
          }

          # 1) 生产配置基线：证明用的是原厂 config（不是 Google gki_defconfig）
          #    注：原厂 config 里混有一批只存在于厂商 modules 树的符号
          #        （UFSFEATURE / DEVICE_MODULES_* 等），GKI 树里根本没有这些 Kconfig 符号，
          #        kconfig 会静默丢弃（kconfig 只在 KCONFIG_WARN_UNKNOWN_SYMBOLS 时才报），
          #        所以不能拿它们当断言 —— 上一轮 run3 就是死在 check UFSFEATURE 上。
          #        ARCH_MEDIATEK 才是货真价实、且原厂 =y 的 GKI 符号。
          check ARCH_MEDIATEK

          # 1.5) 原厂模块符号依赖的"立即失败"断言（run9 的教训：编完 20 分钟才发现白编）
          #      这批符号不是我们想要的调试功能，而是原厂 vendor 模块 insmod 时要解析的：
          #      kasan_flag_enabled 由 monitor_hang / mali / wlan 等 22 个模块引用，
          #      且只有 CONFIG_KASAN_HW_TAGS=y（运行时可开关的硬件标签模式）才会导出该符号，
          #      光 CONFIG_KASAN=y 不够。所以 debug_info=true 时必须逐项断言。
          if [ "${{ inputs.debug_info }}" = "true" ]; then
            for opt in KASAN KASAN_HW_TAGS UBSAN MODVERSIONS DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES KUNIT ARM64_MTE; do
              check "$opt"
            done
            for opt in UBSAN_BOUNDS UBSAN_LOCAL_BOUNDS; do
              report "$opt"
            done
            if grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config; then
              echo "::error::CONFIG_MODULE_SIG_FORCE=y（签名强制会拒绝原厂模块）"; exit 1
            fi
            echo "---- 模块可见符号自检（Module.symvers 在 modpost 之后才生成，这里先查 .config）----"
          fi

          # 2) Droidspaces 必需项（我们自己写进 defconfig 的，必须生效）
          for opt in SYSVIPC POSIX_MQUEUE IPC_NS UTS_NS PID_NS DEVTMPFS USER_NS \
                     MACVLAN TMPFS_XATTR TMPFS_POSIX_ACL NETFILTER_ADVANCED; do
            check "$opt"
          done

          # 2.5) kABI 红线（run5 就是死在这四项上）：
          #      struct module 里 DEBUG_INFO_BTF_MODULES / KUNIT 两段 #ifdef 会改变字段布局，
          #      导出符号 module_layout 的 CRC 是按 struct module 完整定义算的 →
          #      改了以后原厂 vendor 模块全部报 "disagrees about version of symbol module_layout"
          #      然后 Exec format error，第一段 init 加不上模块，机器直接重启。
          for opt in DEBUG_INFO DEBUG_INFO_DWARF4 DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES KUNIT; do
            check "$opt"
          done

          # 3) 容器 20 项里的其余符号：只报告，不中断
          { echo "---- 容器必需符号（本次构建 out/.config 实测）----"
            for opt in NAMESPACES NET_NS CGROUPS MEMCG CGROUP_FREEZER CGROUP_DEVICE \
                       SECCOMP SECCOMP_FILTER OVERLAY_FS TMPFS VETH BRIDGE; do
              report "$opt"
            done
          } | tee "$GITHUB_WORKSPACE/artifacts/config_check.txt"

          # 4) 原厂 config vs 最终 .config 的完整差异（诊断用，不中断）
          echo "---- stock config vs final .config diff ----"
          diff -u \
            <(grep -E '^(CONFIG_|# CONFIG_)' "$GITHUB_WORKSPACE/config/plf110_stock.config" | LC_ALL=C sort) \
            <(grep -E '^(CONFIG_|# CONFIG_)' out/.config | LC_ALL=C sort) \
            > "$GITHUB_WORKSPACE/artifacts/stock_vs_final.diff" || true
          echo "diff 变更行数: $(grep -c '^[+-]' "$GITHUB_WORKSPACE/artifacts/stock_vs_final.diff" || true)"
          sed -n '1,140p' "$GITHUB_WORKSPACE/artifacts/stock_vs_final.diff" || true

          # 5) 可选功能（本次全部 false，只有 true 时才断言）
          if [ "${BBR:-false}" = "true" ]; then check TCP_CONG_BBR; fi
          if [ "${NET_SCHED:-false}" = "true" ]; then check NET_SCH_CAKE; fi
          if [ "${IP_SET_NAT:-false}" = "true" ]; then check IP_SET; check IP6_NF_NAT; fi
          if [ "${NTFS3:-false}" = "true" ]; then check NTFS3_FS; fi
          if [ "${SQUASHFS:-false}" = "true" ]; then check SQUASHFS; fi
          if [ "${EXTRA_FS:-false}" = "true" ]; then
            check ISO9660_FS; check UDF_FS; check CIFS; check NFS_FS
          fi
          if [ "${CONTAINER_NET:-false}" = "true" ]; then check IPVLAN; fi
          if [ "${NTSYNC:-false}" = "true" ]; then
            grep -q '^CONFIG_NTSYNC=y$' out/.config || echo "::warning::NTSync 未生效（补丁未应用全）"
          fi
          if [ "${NET_DEFAULTS:-false}" = "true" ]; then
            grep -q '^CONFIG_DEFAULT_BBR=y$' out/.config || echo "::warning::DEFAULT_BBR 未生效"
            grep -q '^CONFIG_DEFAULT_FQ=y$' out/.config || echo "::warning::DEFAULT_FQ 未生效"
          fi
          if [ "${{ inputs.debug_info }}" != "true" ]; then
            if grep -q '^CONFIG_KASAN=y$' out/.config; then
              echo "::error::KASAN still enabled"; exit 1
            fi
          fi
          echo "---- 关键配置现状 ----"
          grep -E '^CONFIG_(LTO|CFI|KASAN|TCP_CONG_BBR|NTFS3_FS|SQUASHFS|NTSYNC|CIFS|IPVLAN|CGROUP_PIDS|CFS_BANDWIDTH)=' \
            out/.config || true

          make -j"$(nproc)" O=out Image 2>&1 | tee build.log

      - name: Validate Image
        run: |
          set -e
          IMG="$KDIR/out/arch/arm64/boot/Image"
          [ -f "$IMG" ] || { echo "::error::Image not found"; exit 1; }
          file "$IMG"
          ls -lh "$IMG"
          strings "$IMG" | grep -E 'Linux version 6\.1\.134' | head -n 2 \
            || { echo "::error::kernel version is not 6.1.134"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IMG" "$GITHUB_WORKSPACE/artifacts/Image"
          cp "$KDIR/out/.config" "$GITHUB_WORKSPACE/artifacts/kernel.config"
          cp "$KDIR/out/Module.symvers" "$GITHUB_WORKSPACE/artifacts/Module.symvers" 2>/dev/null || true
          cp "$KDIR/out/System.map" "$GITHUB_WORKSPACE/artifacts/System.map" 2>/dev/null || true
          cp "$KDIR/build.log" "$GITHUB_WORKSPACE/artifacts/build.log" 2>/dev/null || true

          # 模块可见符号自检：System.map 只证明符号存在，Module.symvers 才证明"对模块导出"
          # 判据来源（用 600 个原厂已加载模块做 UND 全集反推）：
          #   强制项 -> kasan_flag_enabled（monitor_hang/mali/wlan 等 22 个模块引用，
          #             且只有 KASAN_HW_TAGS 会导出它；System.map 里的 __ksymtab_ 标签等价可查）
          #   非强制 -> __ubsan_handle_*：实测没有任何原厂模块引用（原厂也是 UBSAN_TRAP=y，
          #             处理函数不会产生符号），所以只报告不阻断
          if [ "${{ inputs.debug_info }}" = "true" ]; then
            SYMV="$GITHUB_WORKSPACE/artifacts/Module.symvers"
            MAP="$GITHUB_WORKSPACE/artifacts/System.map"
            ok=1
            if [ -f "$SYMV" ]; then
              echo "用 Module.symvers 校验导出（首选判据）"
              for s in kasan_flag_enabled; do
                if grep -qwE "^0x[0-9a-fA-F]+[[:space:]]+${s}[[:space:]]" "$SYMV"; then
                  echo "OK export $s"
                else
                  echo "::error::Module.symvers 里没有 $s（原厂模块会 Unknown symbol）"; ok=0
                fi
              done
            else
              echo "::warning::本次没有 Module.symvers（只 make Image 时 modpost 不产出），退回 System.map 的 __ksymtab_ 标签"
              for s in kasan_flag_enabled; do
                if grep -q " __ksymtab_${s}$" "$MAP"; then
                  echo "OK export $s (via System.map)"
                else
                  echo "::error::System.map 里没有 __ksymtab_$s"; ok=0
                fi
              done
            fi
            for s in __ubsan_handle_out_of_bounds __ubsan_handle_type_mismatch; do
              grep -q " __ksymtab_${s}$" "$MAP" && echo "note: $s 已导出" || echo "note: $s 未导出（原厂模块也不引用，无影响）"
            done
            [ "$ok" -eq 1 ] || exit 1
          fi

          sha256sum "$GITHUB_WORKSPACE/artifacts/Image" \
            | tee "$GITHUB_WORKSPACE/artifacts/Image.sha256"

      - name: Package AnyKernel3 zip
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          curl -LfsS --retry 3 -o ak3.tar.gz "$AK3_URL"
          mkdir -p ak3
          tar -xzf ak3.tar.gz -C ak3
          AK3DIR="$(find ak3 -maxdepth 1 -mindepth 1 -type d | head -n1)"
          cp artifacts/Image "$AK3DIR/Image"
          sed -i 's|^kernel.string=.*|kernel.string=PLF110 6.1.134 (Droidspaces) custom build|' \
            "$AK3DIR/anykernel.sh"
          ( cd "$AK3DIR" && zip -q -r9 "$GITHUB_WORKSPACE/artifacts/AK3_${NAME}-$(date +%Y%m%d).zip" . )
          ls -lh artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.NAME }}-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 30
